[project]
name = "fieldlinker-display-raspi"
version = "0.1.0"
description = "Raspberry Pi WebSocket to SPI bridge for FieldLinker Display"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
raspi = ["spidev>=3.6"]
